<!DOCTYPE html>
<html lang="ar" dir="rtl" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>StudyGuide Palestine PRO 2026</title>
    <style>
        :root {
            --bg-color: #f0f4f8; --text-color: #1d3557; --info-box: #caf0f8;
            --info-border: #00b4d8; --card-bg: #ffffff;
        }
        [data-theme="dark"] {
            --bg-color: #121212; --text-color: #e0e0e0; --info-box: #1e1e1e;
            --info-border: #90caf9; --card-bg: #1e1e1e;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; transition: 0.3s; padding-bottom: 50px; }
        
        .news-ticker { background: #e63946; color: white; padding: 10px 0; overflow: hidden; white-space: nowrap; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .news-ticker div { display: inline-block; padding-left: 100%; animation: ticker 20s linear infinite; font-weight: bold; }
        @keyframes ticker { 0% { transform: translate(0, 0); } 100% { transform: translate(100%, 0); } }

        .container { padding: 20px; }
        .school-name { font-size: 22px; color: #e63946; font-weight: bold; text-align: center; margin-top: 15px; }
        
        .platform { 
            display: flex; align-items: center; justify-content: flex-start; 
            margin: 15px auto; padding: 12px 20px; border-radius: 15px; 
            width: 90%; max-width: 350px; cursor: pointer; color: #fff; box-shadow: 0 6px 15px rgba(0,0,0,0.1); transition: transform 0.2s; 
        }
        .platform:hover { transform: scale(1.03); }
        .platform svg { width: 45px; height: 45px; object-fit: contain; margin-left: 20px; background: white; border-radius: 8px; padding: 2px; flex-shrink: 0; }
        [dir="ltr"] .platform svg { margin-left: 0; margin-right: 20px; }
        .ischool { background: linear-gradient(45deg,#2a9d8f,#52b788); }
        .teams { background: linear-gradient(45deg,#4c5cc4,#5b5fc7); }
        .iphone { background: linear-gradient(45deg,#6d28d9,#a855f7); }

        .info-box { background: var(--info-box); border-right: 5px solid var(--info-border); padding: 15px; margin: 15px auto; width: 95%; max-width: 600px; border-radius: 10px; color: var(--text-color); }
        [dir="ltr"] .info-box { border-right: none; border-left: 5px solid var(--info-border); }
        
        .alert-text { color: #e63946; font-weight: bold; text-align: center; margin: 10px 0; display: block; background: #fff3f3; padding: 8px; border-radius: 5px; border: 1px dashed #e63946; font-size: 13px; }
        .support-text { color: #0077b6; font-weight: bold; text-align: center; margin: 10px 0; display: block; background: #e7f3f9; padding: 10px; border-radius: 8px; font-size: 14px; border: 1px solid #0077b6; text-decoration: none; }

        .links-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; margin-bottom: 15px; }
        .btn-link { background: #457b9d; color: white; padding: 10px; text-align: center; border-radius: 5px; text-decoration: none; font-size: 13px; font-weight: bold; transition: 0.3s; }
        .btn-link:hover { background: #1d3557; }

        .contact-designer-btn { 
            background: #e63946; color: white; padding: 15px; border-radius: 10px; 
            margin: 20px auto; width: 95%; max-width: 600px; text-align: center; 
            text-decoration: none; display: block; font-weight: bold; transition: 0.3s; 
            box-shadow: 0 4px 10px rgba(230, 57, 70, 0.3); 
        }
        .contact-designer-btn:hover { background: #c12e3a; transform: translateY(-2px); }

        button { cursor: pointer; border: none; border-radius: 6px; font-weight: bold; transition: 0.3s; }
        .copyBtn { background: #457b9d; color: white; padding: 10px; margin-top: 10px; width: 100%; }

        .whatsapp-btn { position: fixed; bottom: 20px; left: 20px; background: #25d366; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 999; box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4); transition: 0.3s; text-decoration: none; }
        .whatsapp-btn:hover { transform: scale(1.1); }
        [dir="ltr"] .whatsapp-btn { left: auto; right: 20px; }
        
        .result-container { display: none; background: rgba(0,0,0,0.05); padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px solid #ddd; }
        .id-status { font-size: 13px; margin-top: 5px; display: block; font-weight: bold; }

        .controls { display: flex; justify-content: center; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
    </style>
</head>
<body>

        validId: "✅ Valid ID Number",
        invalidId: "❌ Invalid ID Number",
        copySuccess: "Copied successfully!",
        ischoolHeader: "iSchool Palestine",
        ischoolAlert: "💡 Note: Username is the same as the password (ID Number).",
        officialSite: "🌐 Official Website",
        androidApp: "📲 Android App",
        pdfGuide: "📖 Official Guide (PDF)",
        idPlaceholder: "Enter ID Number (9 digits)",
        userLabel: "👤 Username:",
        passLabel: "🔑 Default Password:",
        copyData: "Copy Data",
        teamsHeader: "Microsoft Teams 2026",
        teamsAlert: "⚠️ Please ensure to change your password after first login.",
        supportLabel: "💬 Tech Support (Mr. Nour El-Din):",
        teamsWeb: "Open Teams Web 2026",
        teamsPlay: "Download (Google Play)",

function updateUI() {
    const t = translations[currentLang];
    document.getElementById('mainHtml').dir = currentLang === 'ar' ? 'rtl' : 'ltr';
    document.getElementById('mainHtml').lang = currentLang;
    
    document.getElementById('tickerText').innerText = t.ticker;
    document.getElementById('schoolTitle').innerText = t.school;
    document.getElementById('langBtn').innerText = t.langBtn;
    document.getElementById('labelIschool').innerText = t.labelIschool;
    document.getElementById('labelTeams').innerText = t.labelTeams;
    document.getElementById('labelIphone').innerText = t.labelIphone;
    document.getElementById('contactBtn').innerText = t.contactBtn;
    document.getElementById('footerText').innerText = t.footer;
    
    const theme = document.body.getAttribute('data-theme');
    document.getElementById('darkModeBtn').innerText = theme === 'dark' ? t.darkMode : t.lightMode;
    
    if(document.getElementById('info').style.display !== 'none') {
        if(document.getElementById('idISchool')) showISchool();
        else if(document.getElementById('idTeams')) showTeams();
        else if(document.getElementById('idIphone')) showIphone();
    }
}

function toggleLang() {
    currentLang = currentLang === 'ar' ? 'en' : 'ar';
    localStorage.setItem('lang', currentLang);
    updateUI();
}

function isValidPalestineID(id) {
    if (!/^\d{9}$/.test(id)) return false;
    let sum = 0;
    for (let i = 0; i < 8; i++) {
        let num = parseInt(id[i]) * ((i % 2 === 0) ? 1 : 2);
        if (num > 9) num -= 9;
        sum += num;
    }
    return (sum + parseInt(id[8])) % 10 === 0;
}

function toggleDarkMode() {
    const theme = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.body.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
    const t = translations[currentLang];
    document.getElementById('darkModeBtn').innerText = theme === 'dark' ? t.darkMode : t.lightMode;
}

document.body.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
updateUI();

function showISchool() {
    const info = document.getElementById('info'); info.style.display = 'block';
    const t = translations[currentLang];
    info.innerHTML = `
        <h3>${t.ischoolHeader}</h3>
        <span class="alert-text">${t.ischoolAlert}</span>
        
        <div class="links-grid">
            <a href="https://www.eschool.edu.ps" target="_blank" class="btn-link">${t.officialSite}</a>
            <a href="https://eschoolps.ar.uptodown.com/android" target="_blank" class="btn-link">${t.androidApp}</a>
            <a href="https://moe.edu.ps/m/3784" target="_blank" class="btn-link" style="grid-column: span 2; background:#2a9d8f;">${t.pdfGuide}</a>
        </div>
        
        <hr>
        <input type="text" id="idISchool" maxlength="9" placeholder="${t.idPlaceholder}" style="width:100%; padding:12px; border-radius:5px; border:2px solid #ccc; box-sizing:border-box;">
        <span id="statusISchool" class="id-status"></span>

        <div id="resISchool" class="result-container">
            <p>${t.userLabel} <strong id="uI">-</strong></p>
            <p>${t.passLabel} <strong id="pI">-</strong></p>
            <button class="copyBtn" onclick="copyTxt('uI', 'pI')">${t.copyData}</button>
        </div>
    `;
    document.getElementById('idISchool').oninput = function() {
        const val = this.value.trim();
        const status = document.getElementById('statusISchool');
        const res = document.getElementById('resISchool');
        
        if(val.length === 9) {
            if(isValidPalestineID(val)) {
                status.innerText = t.validId; status.style.color = "green";
                document.getElementById('uI').innerText = val;
                document.getElementById('pI').innerText = val;
                res.style.display = 'block';
            } else {
                status.innerText = t.invalidId; status.style.color = "red";
                res.style.display = 'none';
            }
        } else { status.innerText = ""; res.style.display = 'none'; }
    };
}

function showTeams() {
    const info = document.getElementById('info'); info.style.display = 'block';
    const t = translations[currentLang];
    info.innerHTML = `
        <h3>${t.teamsHeader}</h3>
        <span class="alert-text">${t.teamsAlert}</span>
        
        <a href="https://wa.me/972598019795" class="support-text" target="_blank">
            ${t.supportLabel} <br> +972 59-801-9795
        </a>

        <div class="links-grid">
            <a href="https://www.microsoft.com/ar-ww/microsoft-teams/log-in" target="_blank" class="btn-link" style="background:#4c5cc4;">${t.teamsWeb}</a>
            <a href="https://play.google.com/store/apps/details?id=com.microsoft.teams" target="_blank" class="btn-link" style="background:#4c5cc4;">${t.teamsPlay}</a>
        </div>

        <input type="text" id="idTeams" maxlength="9" placeholder="${t.idPlaceholder}" style="width:100%; padding:12px; border-radius:5px; border:2px solid #ccc; box-sizing:border-box;">

    document.getElementById('idTeams').oninput = function() {

        if(id.length === 9) {
            if(isValidPalestineID(id)) {
                status.innerText = t.validId; status.style.color = "green";
                document.getElementById('eT').innerText = id + "@vgaza.edu.ps";
                document.getElementById('pT').innerText = "Gaza@" + id.substring(0, 5);

            } else {

        } else { status.innerText = ""; res.style.display = 'none'; }

}

function showIphone() {
    const info = document.getElementById('info'); info.style.display = 'block';
    const t = translations[currentLang];
    info.innerHTML = `

            <a href="msteams://" class="btn-link" style="background:#6d28d9;">${t.openIphone}</a>

            <button class="copyBtn" style="background:#6d28d9;" onclick="copyTxt('eA', 'pA')">${t.copyTeams}</button>
        </div>
    `;
    document.getElementById('idIphone').oninput = function() {
        const id = this.value.trim();
        const status = document.getElementById('statusIphone');
        const res = document.getElementById('resIphone');

        if(id.length === 9) {
            if(isValidPalestineID(id)) {
                status.innerText = t.validId; status.style.color = "green";
                document.getElementById('eA').innerText = id + "@vgaza.edu.ps";
                document.getElementById('pA').innerText = "Gaza@" + id.substring(0, 5);
                res.style.display = 'block';
            } else {

                res.style.display = 'none';
            }
        } else { status.innerText = ""; res.style.display = 'none'; }

}

function copyTxt(id1, id2) {
    const t1 = document.getElementById(id1).innerText; const t2 = document.getElementById(id2).innerText;
    if(t1 === "-") return;
    navigator.clipboard.writeText(`User: ${t1}\nPass: ${t2}`); 
    alert(translations[currentLang].copySuccess);
}
</script>
